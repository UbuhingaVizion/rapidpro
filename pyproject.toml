[project]
name = "temba"
version = "7.4.2"
description = "Hosted service for visually building interactive messaging applications"
authors = [{ name = "Nyaruka", email = "code@nyaruka.com" }]
requires-python = ">=3.12,<4"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=4.2.0,<5",
    "django-compressor>=4.4,<5",
    "django-countries>=7.6.1,<8",
    "django-hamlpy>=1.4.4,<2",
    "django-mptt>=0.16.0,<0.17",
    "django-redis>=5.4.0,<6",
    "django-storages>=1.14.2,<2",
    "django-timezone-field>=6.1.0,<7",
    "djangorestframework~=3.15.2",
    "dj-database-url>=0.5.0,<0.6",
    "smartmin>=4.2.3,<5",
    "celery>=5.4.0,<6",
    "redis>=5.0.8,<6",
    "elasticsearch>=7.11.0,<8",
    "elasticsearch-dsl>=7.3.0,<8",
    "analytics-python>=1.4.0,<2",
    "boto3>=1.35.0,<2",
    "cryptography>=43.0.0,<44",
    "vonage==2.5.2",
    "pyfcm>=1.5.1,<2",
    "pyotp==2.4.1",
    "python-telegram-bot>=13.14,<14",
    "sentry-sdk>=2.0.0,<3",
    "stripe>=5.0.0,<6",
    "twilio==6.24.0",
    "twython==3.5.0",
    "geojson>=3.1.0,<4",
    "Markdown>=3.7,<4",
    "polib>=1.2.0,<2",
    "pyexcel>=0.7.0,<0.8",
    "pyexcel-xls>=0.7.0,<0.8",
    "pyexcel-xlsx>=0.6.0,<0.7",
    "python-magic>=0.4.27,<0.5",
    "xlsxlite>=0.2.0,<0.3",
    "colorama>=0.4.6,<0.5",
    "gunicorn>=23.0.0,<24",
    "iptools>=0.7.0,<0.8",
    "iso-639>=0.4.5,<0.5",
    "iso8601>=0.1.14,<0.2",
    "phonenumbers>=8.13.0,<9",
    "pycountry>=24.6.1,<25",
    "python-dateutil>=2.9.0,<3",
    "psycopg2-binary>=2.9.9,<3",
    "python-intercom>=3.1.0,<4",
    "packaging>=24.0,<25",
    "requests-toolbelt>=1.0.0,<2",
    "chardet>=5.2.0,<6",
    "openpyxl>=3.1.2,<4",
    "setuptools<81",
    "urllib3<2",
]

[project.urls]
repository = "http://github.com/rapidpro/rapidpro"

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.6",
    "coverage==7.16.0",
    "codecov==2.1.13",
    "responses==0.25.8",
    "beautifulsoup4==4.15.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
    ".direnv",
    ".venv",
    "env",
    "config",
    "static/bower",
    "sitestatic/bower",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E203", # whitespace before ':' (conflicts with the formatter)
    "E501", # line too long (handled by the formatter)
    "F405", # may be undefined from star imports
]

[tool.ruff.lint.isort]
known-first-party = ["temba"]
