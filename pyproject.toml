[project]
name = "temba"
version = "9.0.0"
description = "Hosted service for visually building interactive messaging applications"
authors = [{ name = "Nyaruka", email = "code@nyaruka.com" }]
requires-python = ">=3.12,<4"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django>=4.2.3,<5",
    "django-compressor>=4.3.1,<5",
    "django-countries>=7.6.1,<8",
    "django-mptt>=0.12,<0.13",
    "django-redis>=4.12.1,<5",
    "django-storages>=1.11.1,<2",
    "django-timezone-field>=6.1,<7",
    "djangorestframework>=3.12.2,<4",
    "dj-database-url>=0.5,<0.6",
    "smartmin>=4.2.3,<5",
    "celery>=5.1,<6",
    "redis>=4.5.4,<5",
    "elasticsearch>=7.11,<8",
    "elasticsearch-dsl>=7.3,<8",
    "boto3>=1.28.3,<2",
    "cryptography>=41,<42",
    "vonage==2.5.2",
    "pyfcm>=1.5.1,<2",
    "pyotp==2.4.1",
    "python-telegram-bot>=13.14,<14",
    "twilio==6.24.0",
    "twython==3.5.0",
    "geojson>=2.5,<3",
    "Markdown>=3.3.4,<4",
    "polib>=1.1,<2",
    "pyexcel>=0.7,<0.8",
    "pyexcel-xls>=0.7,<0.8",
    "pyexcel-xlsx>=0.6,<0.7",
    "python-magic>=0.4.22,<0.5",
    "xlsxlite>=0.2,<0.3",
    "colorama>=0.4.4,<0.5",
    "gunicorn>=22,<23",
    "iptools>=0.7,<0.8",
    "iso-639>=0.4.5,<0.5",
    "iso8601>=0.1.14,<0.2",
    "phonenumbers>=8.13.16,<9",
    "pycountry>=22.3.5,<23",
    "python-dateutil>=2.8.2,<3",
    "regex>=2023.10.3,<2027",
    "packaging>=22,<23",
    "requests-toolbelt>=1,<2",
    "urllib3<2",
    "chardet>=4,<5",
    "openpyxl>=3.1.2,<4",
    "ffmpeg-python>=0.2,<0.3",
    "slack-sdk==3.17.0",
    "django-formtools>=2.5.1,<3",
    "psycopg[binary]>=3.1.9,<4",
    "pillow>=10.1,<11",
    "django-imagekit>=5,<6",
    "setuptools<81",
]

[project.urls]
repository = "http://github.com/rapidpro/rapidpro"

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.6",
    "coverage==7.16.0",
    "codecov==2.1.13",
    "responses==0.25.8",
    "beautifulsoup4==4.15.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
    ".direnv",
    ".venv",
    "env",
    "config",
    "static/bower",
    "sitestatic/bower",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E203", # whitespace before ':' (conflicts with the formatter)
    "E501", # line too long (handled by the formatter)
    "F405", # may be undefined from star imports
]

[tool.ruff.lint.isort]
known-first-party = ["temba"]
