name: CI
on: [push, pull_request]
jobs:
  test:
    name: Test
    env:
      python-version: "3.12"
      redis-version: "7.2"
      node-version: "20"
      rpindexer-version: "7.4.0"
      mailroom-version: "7.5.36"
      ELASTICSEARCH_URL: "http://127.0.0.1:9200"
      DJANGO_SETTINGS_MODULE: temba.settings_ci
    strategy:
      matrix:
        postgres-image:
          - postgis/postgis:16-3.5-alpine
          - postgis/postgis:18-3.6-alpine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ matrix.postgres-image }}
        env:
          POSTGRES_DB: temba
          POSTGRES_USER: temba
          POSTGRES_PASSWORD: temba
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elastic:
        image: elasticsearch:7.17.9
        ports:
          - 9200:9200
          - 9300:9300
        env:
          discovery.type: single-node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends libgdal-dev gettext libmagic1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Redis
        uses: zhulik/redis-action@v1.0.0
        with:
          redis version: ${{ env.redis-version }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}

      - name: Initialize environment
        run: |
          uv sync --frozen
          npm install
          sudo npm install -g less
          ln -s ${{ github.workspace }}/temba/settings.py.dev ${{ github.workspace }}/temba/settings.py
          .venv/bin/python manage.py migrate
          # fetch and extract rp-indexer
          wget https://github.com/nyaruka/rp-indexer/releases/download/v${{ env.rpindexer-version }}/rp-indexer_${{ env.rpindexer-version }}_linux_amd64.tar.gz
          tar -xvf rp-indexer_${{ env.rpindexer-version }}_linux_amd64.tar.gz rp-indexer
          # fetch, extract and start mailroom
          wget https://github.com/nyaruka/mailroom/releases/download/v${{ env.mailroom-version }}/mailroom_${{ env.mailroom-version }}_linux_amd64.tar.gz
          tar -xvf mailroom_${{ env.mailroom-version }}_linux_amd64.tar.gz mailroom
          ./mailroom -db=postgres://temba:temba@localhost:5432/temba?sslmode=disable -redis=redis://localhost:6379/10 -log-level=info > mailroom.log &

      - name: Run pre-test checks
        run: |
          # test that everything is well formatted, linted, and has no missing migrations
          .venv/bin/pre-commit run --all-files
          .venv/bin/python manage.py makemigrations --check --dry-run
          # check we can collect and compress all static files
          .venv/bin/python manage.py collectstatic --noinput --verbosity=0
          .venv/bin/python manage.py compress --extension=".haml" --settings=temba.settings_compress

      - name: Run tests
        run: |
          .venv/bin/coverage run manage.py test --keepdb --noinput --verbosity=2
          .venv/bin/coverage report -i
          .venv/bin/coverage report -i --rcfile .coveragerc_todo
          .venv/bin/coverage xml

      - name: Mailroom log
        if: failure()
        run: cat mailroom.log

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
